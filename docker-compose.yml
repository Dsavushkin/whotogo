services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://whotogo:${POSTGRES_PASSWORD}@db:5432/whotogo
      WEBAPP_URL: https://kompaniyana.ru  # основной адрес сайта и Mini App
      DEV: "0"
      BOT_USERNAME: whotogobot
      ADMIN_EMAILS: ${ADMIN_EMAILS:-da.savushkin4@gmail.com}
    depends_on:
      db:
        condition: service_healthy

  # Only when COMPOSE_PROFILES=tunnel is set in .env (see deploy/tunnel.sh).
  tgtunnel:
    build:
      context: .
      dockerfile: deploy/tunnel.Dockerfile
    profiles: ["tunnel"]
    restart: unless-stopped
    volumes:
      - ./deploy/tunnel:/keys:ro
    command: >
      ssh -N -g -D 0.0.0.0:1080 -p ${TUNNEL_PORT:-22}
      -i /keys/id_ed25519 -o UserKnownHostsFile=/keys/known_hosts -o StrictHostKeyChecking=yes
      -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes
      tgproxy@${TUNNEL_HOST:-none}

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: whotogo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: whotogo
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whotogo"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [app]

volumes:
  db:
  caddy:
